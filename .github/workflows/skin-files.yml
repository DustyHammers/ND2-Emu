# Renders the default skin's images from the 3D model (tools/skin/blender) in parallel and packs them into one
# download, "ND2-skin-files": the files to copy into skins/default/nd2-default/, a read-me and a preview folder.
# Runs on a push to skin-blender whose commit message contains [skin-files], or by hand. The per-job renders are
# deleted at the end; only the one download is kept (7 days).
name: Skin files

on:
  push:
    branches: [skin-blender]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: skin-files-${{ github.ref }}
  cancel-in-progress: true

env:
  BPY_VERSION: 5.2.2
  ART_COMMIT: ec1ba0b              # the flat panel art the paint and ink maps are made from
  SAMPLES: 64

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[skin-files]')
    name: Render ${{ matrix.part.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        part:
          - { name: bg-0, what: bg, frames: '0:6' }
          - { name: bg-1, what: bg, frames: '1:6' }
          - { name: bg-2, what: bg, frames: '2:6' }
          - { name: bg-3, what: bg, frames: '3:6' }
          - { name: bg-4, what: bg, frames: '4:6' }
          - { name: bg-5, what: bg, frames: '5:6' }
          - { name: buttons, what: buttons, frames: '' }
          - { name: leds, what: leds, frames: '' }
          - { name: master-0, what: master, frames: '0:16' }
          - { name: master-1, what: master, frames: '16:32' }
          - { name: master-2, what: master, frames: '32:48' }
          - { name: master-3, what: master, frames: '48:64' }
          - { name: master-4, what: master, frames: '64:80' }
          - { name: master-5, what: master, frames: '80:96' }
          - { name: master-6, what: master, frames: '96:112' }
          - { name: master-7, what: master, frames: '112:128' }
          - { name: enc-0, what: encoder, frames: '0:12' }
          - { name: enc-1, what: encoder, frames: '12:24' }
          - { name: enc-2, what: encoder, frames: '24:36' }
          - { name: enc-3, what: encoder, frames: '36:48' }
          - { name: enc-4, what: encoder, frames: '48:60' }
          - { name: enc-5, what: encoder, frames: '60:72' }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/skin-files.yml
      - name: Blender as a Python module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libxxf86vm1 libxfixes3 libegl1 > /dev/null
          pip install -q "bpy==$BPY_VERSION" numpy pillow scipy OpenEXR
      - name: Paint maps and studio light
        run: |
          git show "$ART_COMMIT:skins/default/nd2-default/ND2Background.jpg" > "$RUNNER_TEMP/art.jpg"
          python3 tools/skin/blender/masks.py "$RUNNER_TEMP/maps" "$RUNNER_TEMP/art.jpg"
          python3 tools/skin/blender/make_hdr.py "$RUNNER_TEMP/studio.exr" 2048
      - name: Render
        run: |
          set -o pipefail
          FR=()
          if [ -n "${{ matrix.part.frames }}" ]; then FR=(--frames "${{ matrix.part.frames }}"); fi
          python3 tools/skin/blender/sprites.py --what "${{ matrix.part.what }}" "${FR[@]}" \
            --maps "$RUNNER_TEMP/maps" --hdr "$RUNNER_TEMP/studio.exr" --samples "$SAMPLES" --out renders 2>&1 \
            | grep -v -e '^Fra:' -e 'EGL Error' -e 'CUEW' | tail -n 20
          ls renders
      - uses: actions/upload-artifact@v7
        with:
          name: part-${{ matrix.part.name }}
          path: renders
          retention-days: 1

  package:
    name: Pack the skin files
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tools
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          pip install -q numpy pillow pyoxipng imagequant
      - uses: actions/download-artifact@v7
        with:
          pattern: part-*
          path: renders
          merge-multiple: true
      - name: Pack
        run: |
          ls renders | wc -l
          python3 tools/skin/blender/pack_skin.py renders out/ND2-skin-files
          python3 tools/skin/compress_pngs.py out/ND2-skin-files
          python3 - <<'EOF'
          import hashlib, os, re
          d = 'out/ND2-skin-files'
          p = os.path.join(d, 'README.txt')
          t = open(p).read()
          # the PNGs were recompressed after the read-me was written: refresh their checksums
          def fix(m):
              n = m.group(1)
              return m.group(0).replace(m.group(2), hashlib.md5(open(os.path.join(d, n), 'rb').read()).hexdigest())
          t = re.sub(r'^  (\S+)\s+new md5 ([0-9a-f]{32})', fix, t, flags=re.M)
          open(p, 'w').write(t)
          print(t)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: ND2-skin-files
          path: out/ND2-skin-files
          retention-days: 7
      - name: Remove the per-job renders
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: part-*
          failOnError: false
