<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ND2 Emu panel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b2b2e;--red:#c9212a;--accent:#e3262d;--panel:#1b1b1b;--ink:#ffffff}
html,body{margin:0;background:var(--bg);color:#e8e8ea;font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
.stage{position:relative;width:100%;aspect-ratio:1725/1075}
.unit{position:absolute;left:0;top:40px;width:1725px;height:1035px;transform-origin:0 0}
.body{position:absolute;inset:0;background:var(--red);border-radius:10px;box-shadow:inset 0 3px 0 #e2434b,inset 0 -6px 0 #8f141b,0 18px 40px rgba(0,0,0,.45)}
.lbl{position:absolute;color:#fff;font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap;line-height:1.05}
.ctr{transform:translateX(-50%);text-align:center}
.tag{position:absolute;background:var(--accent);color:#fff;font-weight:700;font-size:19px;padding:1px 5px;border-radius:2px;white-space:nowrap;line-height:1.1}
.btn{position:absolute;width:124px;height:60px;border-radius:9px;cursor:pointer;padding:0}
.btn.black{background:#151515;border:2px solid #050505;box-shadow:inset 0 2px 0 #3a3a3a,0 3px 0 #000}
.btn.grey{background:#dcdcdc;border:2px solid #8f8f8f;box-shadow:inset 0 -6px 0 #b9b9b9,inset 0 2px 0 #f6f6f6,0 3px 0 #555}
.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:3px solid #ffd34d;outline-offset:3px}
.bracket{position:absolute;height:12px;border:2px solid #e9e9e9;border-bottom:0}
.bracket span{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--panel);padding:0 8px;color:#fff;font-weight:800;font-size:20px;letter-spacing:.06em}
.led{position:absolute;width:16px;height:16px;border-radius:50%;margin:-8px 0 0 -8px}
.seg{position:absolute;border-radius:3px}
.jack{position:absolute;top:-26px;width:74px;height:30px;margin-left:-37px;border-radius:10px 10px 4px 4px;background:#1a1a1a;box-shadow:inset 0 3px 0 #444}
.strip{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #55555c;border-radius:6px;padding:8px 12px;font:600 15px 'Barlow Semi Condensed',sans-serif;cursor:pointer;background:#3a3a40;color:#e8e8ea}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><div class="unit" id="unit"></div></div>
  <div class="strip">
    <div><b style="letter-spacing:.04em">EMULATOR STATE</b> &nbsp;<span id="title"></span></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script>
// Panel states captured from the running emulator (OS v3.00, factory bank 1): 7-segment bytes (active-low) + LED duty by LED index
const STATES = [
  { id: 'program', label: 'Program', title: 'Program view (bank 1, program 1)', seg: [140,121,255,249], led: {} },
  { id: 'edit_filter', label: 'Filter', title: 'Ch 1, upper row: Noise Filter', seg: [255,255,249,146], led: {4:.95,21:.89} },
  { id: 'edit_spectra', label: 'Row Select', title: 'Row Select: lower row, Spectra / Wave', seg: [191,63,136,164], led: {4:.95,29:1} },
  { id: 'ch3_dyntimb', label: 'Channel 3', title: 'Channel 3, Dyn Timbre', seg: [255,255,176,192], led: {1:.91,20:1} },
  { id: 'edit_pitch', label: 'Pitch', title: 'Ch 1, Pitch', seg: [255,176,25,192], led: {4:1,11:1} },
  { id: 'shift_inpsens', label: 'Shift + Inp Sens', title: 'Shift + INP SENS', seg: [18,255,248,146], led: {6:1,25:.18} },
  { id: 'solo', label: 'Solo Edit', title: 'Shift + Row Select: Solo Edit on', seg: [255,255,249,146], led: {4:1,7:1,21:.89} },
  { id: 'trig', label: 'Pads 1 + 4', title: 'Pads 1 and 4 hit (TRIG/MG LEDs)', seg: [140,121,255,249], led: {6:.71,23:.49} }
];
const parX = [370,510,650,790,930,1070,1210,1350], chX = [1065,1138,1212,1286,1360,1433];
const LED_UP = [21,0,2,8,10,16,18,24], LED_LO = [29,1,3,9,11,17,19,25], LED_PK = [4,12,20,27,26,28], LED_TG = [6,14,15,23,22,30], LED_SOLO = 7;
const UP = [['FILTER','FILT TYPE'],['DYN FILTER','FILT RES'],['ATK/RATE','ENV MODE'],['DECAY','TYPE/DYN'],['DISTORT','TYPE'],['EQ FREQ','GAIN'],['REPEAT','AMOUNT'],['LEVEL','PAN']];
const LO = [['SPECTRA','WAVE'],['DYN TIMB','TIMBRE'],['HI DECAY','PUNCH'],['DECAY','TYPE/DYN'],['PITCH','SCL PRE'],['BEND','TIME'],['LEVEL','TYPE'],['TONE ▶','◀ NOISE']];
const SHIFT = ['COPY','PASTE','PANIC','SYSTEM','MIDI','TRIG TYPE','INP THRES','INP SENS'];
const PARAM_STATE = ['edit_filter',null,null,null,'edit_pitch',null,null,null];
let cur = 'program', master = 0.75;

function ledStyle(v){
  v = Math.max(0, Math.min(1, v || 0));
  const m = (a,b) => Math.round(a + (b - a) * v);
  const glow = v > .05 ? `0 0 ${Math.round(4 + 10 * v)}px rgba(255,50,40,${(.9 * v).toFixed(2)})` : 'inset 0 2px 2px rgba(0,0,0,.6)';
  return `background:rgb(${m(58,255)},${m(54,52)},${m(54,40)});box-shadow:${glow}`;
}
function digitHTML(b){
  const on = bit => !((b >> bit) & 1);
  const s = (bit, css) => `<div class="seg" style="${css};background:${on(bit) ? '#ff3b2f' : '#3b0c0c'};box-shadow:${on(bit) ? '0 0 7px rgba(255,60,40,.85)' : 'none'}"></div>`;
  return `<div style="position:relative;width:56px;height:82px">` +
    s(0,'left:9px;top:0;width:32px;height:8px') + s(1,'left:42px;top:7px;width:8px;height:31px') +
    s(2,'left:42px;top:44px;width:8px;height:31px') + s(3,'left:9px;top:74px;width:32px;height:8px') +
    s(4,'left:0;top:44px;width:8px;height:31px') + s(5,'left:0;top:7px;width:8px;height:31px') +
    s(6,'left:9px;top:37px;width:32px;height:8px') + s(7,'left:48px;top:73px;width:8px;height:8px;border-radius:50%') + `</div>`;
}
function render(){
  const st = STATES.find(s => s.id === cur);
  const L = i => ledStyle(st.led[i]);
  let h = '';
  [118,180,300,762,888,1017,1144,1271,1399,1606].forEach((x,i) => h += `<div class="jack" style="left:${x}px${i===0||i===9?';width:44px;margin-left:-22px':''}"></div>`);
  h += `<div class="body"></div>`;
  [['PHONES',70],['LEFT OUT',180],['RIGHT OUT',300],['MIDI IN',452],['MIDI OUT',617],['CH1',762],['CH2',888],['CH3',1017],['CH4',1144],['CH5',1271],['CH6',1399],['PAD<br>INPUT',1525],['DC 12V<br>250mA',1635]]
    .forEach(([t,x]) => h += `<div class="lbl ctr" style="left:${x}px;top:22px;font-size:19px">${t}</div>`);
  h += `<div style="position:absolute;left:726px;top:58px;width:708px;height:2px;background:#fff"></div><div class="lbl ctr" style="left:1080px;top:48px;font-size:19px;background:var(--red);padding:0 10px">TRIG INPUTS</div>`;
  // black panel
  h += `<div style="position:absolute;left:100px;top:175px;width:1515px;height:520px;border-radius:42px;background:var(--panel)"></div>`;
  // master level
  h += `<div class="lbl ctr" style="left:153px;top:228px">MASTER<br>LEVEL</div><div style="position:absolute;left:81px;top:293px;width:144px;height:144px;border-radius:50%;background:var(--accent)"></div>`;
  for (let i = 0; i < 11; i++) h += `<div style="position:absolute;left:150px;top:293px;width:6px;height:22px;background:#8f141b;transform-origin:3px 72px;transform:rotate(${-135 + 27 * i}deg)"></div>`;
  h += `<button aria-label="Master level" id="master" style="position:absolute;left:106px;top:318px;width:94px;height:94px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 38% 32%,#3a3a3a,#0c0c0c 70%);box-shadow:0 4px 6px rgba(0,0,0,.5);cursor:ns-resize"><div style="position:absolute;left:44px;top:6px;width:6px;height:36px;border-radius:3px;background:#f4f4f4;transform-origin:3px 41px;transform:rotate(${-135 + 270 * master}deg)"></div></button>`;
  // program + display
  h += `<div class="lbl ctr" style="left:420px;top:240px">PROGRAM</div><button class="btn black" data-go="program" aria-label="Program" style="left:358px;top:270px"></button><div class="lbl ctr" style="left:420px;top:340px;background:#e9e9e9;color:#1b1b1b;padding:1px 6px;border-radius:3px;font-size:18px">STORE</div>`;
  h += `<div class="lbl ctr" style="left:622px;top:203px">PROGRAM/<br>VALUE</div><div style="position:absolute;left:497px;top:255px;width:250px;height:92px;background:#1a0303;border:3px solid #050505;border-radius:4px;box-shadow:inset 0 0 18px #000"></div>`;
  h += `<div style="position:absolute;left:512px;top:260px;display:flex;gap:2px;transform:skewX(-7deg)">${st.seg.map(digitHTML).join('')}</div>`;
  // channel select
  h += `<div class="lbl ctr" style="left:894px;top:225px">CHANNEL SELECT</div><button class="btn black" aria-label="Channel select left" style="left:764px;top:255px"></button><button class="btn black" data-go="ch3_dyntimb" aria-label="Channel select right" style="left:900px;top:255px"></button>`;
  h += `<div class="lbl ctr" style="left:826px;top:322px;font-size:19px">MUTE GROUP</div><div class="tag ctr" style="left:962px;top:321px;color:#7d0f14">EDIT GROUP</div><div style="position:absolute;left:770px;top:359px;width:248px;height:2px;background:#e9e9e9"></div><div class="lbl ctr" style="left:894px;top:348px;font-size:19px;background:var(--panel);padding:0 8px">HOLD TO CLEAR</div>`;
  // input channels
  h += `<div class="lbl ctr" style="left:1250px;top:203px">INPUT CHANNELS</div>`;
  chX.forEach((x,i) => h += `<div class="lbl ctr" style="left:${x}px;top:234px">${i+1}</div><div class="led" style="left:${x}px;top:273px;${L(LED_PK[i])}"></div><div class="led" style="left:${x}px;top:312px;${L(LED_TG[i])}"></div>`);
  h += `<div class="lbl" style="left:1457px;top:262px;color:#e8343c">PEAK / FOCUS</div><div class="lbl" style="left:1457px;top:301px;color:#e8343c">TRIG / MG</div>`;
  // parameter rows
  h += `<div class="bracket" style="left:350px;top:392px;width:553px"><span>NOISE</span></div><div class="bracket" style="left:912px;top:392px;width:553px"><span>CHANNEL</span></div>`;
  h += `<div class="bracket" style="left:350px;top:478px;width:830px"><span>TONE</span></div><div class="bracket" style="left:1190px;top:478px;width:130px"><span>CLICK</span></div><div class="bracket" style="left:1330px;top:478px;width:135px"><span>MIX</span></div>`;
  parX.forEach((x,i) => {
    h += `<div class="led" style="left:${x}px;top:425px;${L(LED_UP[i])}"></div><div class="lbl" style="left:${x+18}px;top:402px">${UP[i][0]}</div><div class="tag" style="left:${x+16}px;top:425px">${UP[i][1]}</div>`;
    h += `<div class="led" style="left:${x}px;top:512px;${L(LED_LO[i])}"></div><div class="lbl" style="left:${x+18}px;top:489px">${LO[i][0]}</div>`;
    h += i === 7 ? `<div class="lbl" style="left:${x+18}px;top:512px">${LO[i][1]}</div>` : `<div class="tag" style="left:${x+16}px;top:512px${i===4?';color:#7d0f14':''}">${LO[i][1]}</div>`;
    h += `<button class="btn grey" ${PARAM_STATE[i] ? `data-go="${PARAM_STATE[i]}"` : ''} aria-label="${UP[i][0]} / ${LO[i][0]}" style="left:${x-14}px;top:542px"></button><div class="lbl ctr" style="left:${x+48}px;top:614px">${SHIFT[i]}</div>`;
  });
  // row select, shift
  h += `<div class="lbl ctr" style="left:258px;top:507px">ROW SELECT</div><button class="btn black" data-go="edit_spectra" aria-label="Row select" style="left:196px;top:540px"></button><div class="led" style="left:207px;top:632px;${L(LED_SOLO)}"></div><div class="lbl" style="left:224px;top:618px;font-size:19px">SOLO<br>EDIT</div>`;
  h += `<div class="lbl ctr" style="left:256px;top:728px">SHIFT / EXIT</div><button class="btn grey" data-go="shift_inpsens" aria-label="Shift / Exit" style="left:194px;top:760px"></button>`;
  // lower param + encoder
  h += `<div style="position:absolute;left:445px;top:712px;width:520px;height:236px;border-radius:34px;background:var(--panel)"></div><div style="position:absolute;left:755px;top:675px;width:300px;height:300px;border-radius:50%;background:var(--panel)"></div>`;
  h += `<div class="tag ctr" style="left:557px;top:727px">LOWER PARAM</div><button class="btn grey" aria-label="Lower param" style="left:495px;top:760px"></button><div class="lbl ctr" style="left:557px;top:834px">REPEAT TEMPO</div>`;
  h += `<div style="position:absolute;left:785px;top:705px;width:232px;height:232px;border-radius:50%;border:4px solid var(--accent);box-sizing:border-box"></div><button aria-label="Value encoder" style="position:absolute;left:805px;top:725px;width:192px;height:192px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 40% 34%,#3b3b3b,#101010 68%);box-shadow:0 8px 14px rgba(0,0,0,.6),inset 0 0 0 10px #161616;cursor:grab"></button>`;
  // trig
  h += `<div style="position:absolute;left:1322px;top:708px;width:152px;height:152px;border-radius:22px;background:var(--panel)"></div><div class="lbl ctr" style="left:1398px;top:724px">TRIG</div><button class="btn grey" data-go="trig" aria-label="Trig" style="left:1336px;top:760px"></button><div class="lbl ctr" style="left:1398px;top:832px">TRIG LEVEL</div>`;
  // wordmark placeholder
  h += `<div style="position:absolute;right:85px;top:880px;color:#fff;font-weight:800;font-size:88px;letter-spacing:-.01em;line-height:1">ND2 EMU</div>`;
  document.getElementById('unit').innerHTML = h;
  document.getElementById('title').textContent = st.title;
  document.getElementById('chips').innerHTML = STATES.map(s => `<button class="chip${s.id === cur ? ' on' : ''}" data-go="${s.id}">${s.label}</button>`).join('');
  fit();
}
function fit(){
  const stage = document.getElementById('stage'), unit = document.getElementById('unit');
  unit.style.transform = `scale(${stage.clientWidth / 1725})`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { cur = b.dataset.go; render(); } });
document.addEventListener('wheel', e => { if (e.target.closest('#master')) { e.preventDefault(); master = Math.max(0, Math.min(1, master - e.deltaY / 1000)); render(); } }, { passive: false });
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
