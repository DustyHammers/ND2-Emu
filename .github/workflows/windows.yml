# Windows build (VST3 + Standalone, x64), started by hand: Actions > Windows > Run workflow. Never runs on pushes or
# pull requests, so it never holds up or fails a macOS update. Run on main, it adds the zip to that version's release
# (vX.Y.Z from CMakeLists.txt) as ND2-Windows.zip, replacing an earlier Windows zip there; the release must exist
# (ci.yml makes it with the macOS zip). On another branch it only builds the zip as a download from the run.
# Built with clang-cl (Visual Studio's ClangCL toolset): the same compiler front end and CPU dispatch as macOS. No job
# here uses firmware.
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-plugin:
    name: Windows plugin (VST3 + Standalone, x64)
    runs-on: windows-2025
    permissions:
      contents: write           # the release step only, which runs on main
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: work/deps
          key: deps-windows-${{ hashFiles('scripts/deps.env') }}
      - name: Fetch JUCE, RmlUi, Lua and FreeType (pinned)
        run: scripts/fetch_deps.sh
      - name: Core tests on Windows
        run: |
          cmake -S . -B build/core -A x64 -T ClangCL
          cmake --build build/core --config Release --parallel
          ctest --test-dir build/core -C Release --output-on-failure
      - name: Build the plugin
        run: |
          cmake -S . -B build/plugin -A x64 -T ClangCL -DND2_BUILD_PLUGIN=ON -DND2_BUILD_TESTS=OFF -DND2_BUILD_CLI=OFF
          cmake --build build/plugin --config Release --parallel --target ND2_VST3 ND2_Standalone plugin_test
      - name: Plugin test (bus layouts, state; no firmware)
        run: build/plugin/plugin/Release/plugin_test.exe
      - name: Check plugin identity (must never change)
        run: python scripts/check_plugin_identity.py build/plugin/plugin/ND2_artefacts/Release
      - name: Host tests with pluginval (VST3, strictness 10, no window; no firmware)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 10 --timeout-ms 300000 --skip-gui-tests --output-dir pluginval-logs \
            build/plugin/plugin/ND2_artefacts/Release/VST3/ND2.vst3
      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginval-logs-windows
          path: pluginval-logs
          retention-days: 7
          if-no-files-found: ignore
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^project(ND2Emu VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="ND2-${version}-Windows-$(git rev-parse --short HEAD)"
          art=build/plugin/plugin/ND2_artefacts/Release
          mkdir -p "dist/$name/ND2 Standalone"
          cp -R "$art/VST3/ND2.vst3" "dist/$name/ND2.vst3"
          cp "$art/Standalone/ND2.exe" "dist/$name/ND2 Standalone/"
          cp -R "$art/Standalone/nd2-default" "dist/$name/ND2 Standalone/nd2-default"
          cp plugin/packaging/INSTALL-Windows.txt "dist/$name/INSTALL.txt"
          ls -R "dist/$name" | head -40
          (cd dist && 7z a -tzip -mx=9 "$name.zip" "$name" > /dev/null)
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Add to the release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(ND2Emu VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if ! gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version has no release yet: it is made when the version is merged to main (ci.yml)"; exit 1
          fi
          cp "${{ steps.package.outputs.zip }}" dist/ND2-Windows.zip
          gh release upload "v$version" dist/ND2-Windows.zip --clobber
