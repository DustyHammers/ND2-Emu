<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ND2 skin source</title>
<style>
/* One source for every layer of the default skin. ?layer=<name> shows one layer on a transparent canvas;
   ?layer=all shows everything (preview); &bg=1 leaves the controls out, &notext=1 the lettering. ?seg=<segment> draws
   one display segment cell, ?sprite=banks the BANKS label's lit outline (&lit=1 shows it in the preview).
   Canvas = 1725 x 1035 dp = the body. */
:root{--red:#c9212a;--accent:#e3262d;--panel:#1b1b1b}
html,body{margin:0;background:transparent}
#canvas{position:relative;width:1725px;height:1035px;overflow:hidden;font-family:'Liberation Sans',Arial,sans-serif}
#unit{position:absolute;left:0;top:0;width:1725px;height:1035px}
#unit>*{position:absolute}
.lbl{color:#fff;font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap;line-height:1.05}
.ctr{transform:translateX(-50%);text-align:center}
.tag{background:var(--accent);color:#fff;font-weight:700;font-size:19px;padding:1px 5px;border-radius:2px;white-space:nowrap;line-height:1.1}
.ln{background:#e9e9e9}
.hide{visibility:hidden!important}
/* split elements: a tag's box belongs to the tag-box layer, its lettering to the text layer */
body.L-tagboxes .tag{color:transparent!important}
body.L-text .tag{background:transparent!important}
/* controls (reference only; in the skin these are sprite elements) */
.btn{width:122px;height:59px;background-size:122px 118px}
.btn.black{background-image:url(../../skins/default/nd2-default/ND2BlackButton.png)}
.btn.grey{background-image:url(../../skins/default/nd2-default/ND2GreyButton.png)}
.led{width:22px;height:22px;margin:-11px 0 0 -11px;background:url(../../skins/default/nd2-default/ND2RedLed.png) 0 0/22px 44px}
.led.green{background-image:url(../../skins/default/nd2-default/ND2GreenLed.png)}
.led i{position:absolute;inset:-3px;background:url(../../skins/default/nd2-default/ND2RedLed.png) 0 -28px/28px 56px}
.led.green i{background-image:url(../../skins/default/nd2-default/ND2GreenLed.png)}
.seg{position:absolute;border-radius:3px}
</style>
</head>
<body>
<div id="canvas"><div id="unit"></div></div>
<script>
const P = new URLSearchParams(location.search);
const LAYER = P.get('layer') || 'all';
const SEGMODE = P.get('seg');            // digit sprite mode: unlit | a..g | dp
const SPRITE = P.get('sprite');          // banks: the lit outline of the BANKS label
document.body.classList.add('L-' + LAYER);

// ---- panel model (unit coordinates, same as the approved mockup)
const parX = [370,510,650,790,930,1070,1210,1350], chX = [1065,1138,1212,1286,1360,1433];
const LED_UP = [21,0,2,8,10,16,18,24], LED_LO = [29,1,3,9,11,17,19,25], LED_PK = [4,12,20,27,26,28], LED_TG = [6,14,15,23,22,30], LED_SOLO = 7;
const UP = [['FILTER','FILT TYPE'],['DYN FILTER','FILT RES'],['ATK/RATE','ENV MODE'],['DECAY','TYPE/DYN'],['DISTORT','TYPE'],['EQ FREQ','GAIN'],['REPEAT','AMOUNT'],['LEVEL','PAN']];
const LO = [['SPECTRA','WAVE'],['DYN TIMB','TIMBRE'],['HI DECAY','PUNCH'],['DECAY','TYPE/DYN'],['PITCH','SCL PRE'],['BEND','TIME'],['LEVEL','TYPE'],['TONE ▶','◀ NOISE']];
const SHIFT = ['COPY','PASTE','PANIC','SYSTEM','MIDI','TRIG TYPE','INP THRES','INP SENS'];
const BTN_PARAM = [8,9,10,11,16,17,18,19];
// preview state: solo edit, ch 1 filter, pads 1 and 4 hit; display "  15" (segment bytes, active-low)
const PREVIEW = { seg: [255,255,249,146], led: {4:1,7:1,21:.89,6:.71,23:.49}, master: 0.75, enc: 6 };
if (P.get('unlit')) { PREVIEW.seg = [255,255,255,255]; PREVIEW.led = {}; }
if (P.get('prog')) { PREVIEW.seg = [140,121,255,249]; PREVIEW.led = {}; }

const TRX = [0,1,2,3,4,5].map(i => Math.round(862.5 + (i - 2.5) * 127.4));   // trigger inputs, centred
const U = document.getElementById('unit');
const controls = [];                      // exported for the RML generator
let html = '';
const el = (layer, style, inner = '', cls = '') => { html += `<div class="${cls}" data-layer="${layer}" style="${style}">${inner}</div>`; };
const text = (t, x, y, extra = '', cls = 'lbl ctr') => el('text', `left:${x}px;top:${y}px;${extra}`, t, cls);
const tag = (t, x, y, extra = '', cls = 'tag') => el('tagboxes text', `left:${x}px;top:${y}px;${extra}`, t, cls);

// 02 body
// body: bevelled top and sides (7 dp), the bottom edge rounded over (16 dp). Light from straight above: the bevels
// turn away from it a little; the rounded edge darkens as it curves down (brightness ~ the cosine of its slope).
const BEV = { side: 7, top: 7, bottom: 16 }, BW = 1725, BH = 1035;
{ const facet = (pts, bg) => `<div style="position:absolute;inset:0;clip-path:polygon(${pts});background:${bg}"></div>`;
  const s = BEV.side, t = BEV.top, b = BEV.bottom;
  // the rounded lip first, then the bevels as shades over it (so they run into the lip at the corners)
  el('body', `left:0;top:0;width:${BW}px;height:${BH}px;border-radius:12px;overflow:hidden;background:var(--red)`,
    `<div style="position:absolute;left:0;right:0;bottom:0;height:${b}px;background:linear-gradient(to bottom,rgb(201,33,42) 0%,rgb(200,33,42) 15%,rgb(196,32,41) 30%,rgb(189,31,39) 45%,rgb(178,29,37) 60%,rgb(165,27,35) 72%,rgb(151,25,32) 82%,rgb(135,22,28) 90%,rgb(117,19,24) 96%,rgb(84,14,18) 100%)"></div>` +
    facet(`0 0,${BW}px 0,${BW - s}px ${t}px,${s}px ${t}px`, 'linear-gradient(to bottom,rgba(0,0,0,.10),rgba(0,0,0,.05))') +
    facet(`0 0,${s}px ${t}px,${s}px ${BH - b}px,0 ${BH}px`, 'linear-gradient(to right,rgba(0,0,0,.14),rgba(0,0,0,.08))') +
    facet(`${BW}px 0,${BW}px ${BH}px,${BW - s}px ${BH - b}px,${BW - s}px ${t}px`, 'linear-gradient(to left,rgba(0,0,0,.14),rgba(0,0,0,.08))')); }
// 03 panels (black print)
el('panels', `left:100px;top:175px;width:1515px;height:520px;border-radius:42px;background:var(--panel)`);
el('panels', `left:445px;top:712px;width:520px;height:236px;border-radius:34px;background:var(--panel)`);
el('panels', `left:755px;top:675px;width:300px;height:300px;border-radius:50%;background:var(--panel)`);
el('panels', `left:1322px;top:708px;width:152px;height:152px;border-radius:22px;background:var(--panel)`);
// 04 display window
el('display', `left:497px;top:255px;width:250px;height:92px;background:#1a0303;border:3px solid #050505;border-radius:4px;box-shadow:inset 0 0 18px #000;box-sizing:content-box`);
// 05 red print: master level scale and the encoder ring
el('redprint', `left:81px;top:293px;width:144px;height:144px;border-radius:50%;background:var(--accent)`);
for (let i = 0; i < 11; i++) el('redprint', `left:150px;top:293px;width:6px;height:22px;background:#8f141b;transform-origin:3px 72px;transform:rotate(${-135 + 27 * i}deg)`);
el('redprint', `left:785px;top:705px;width:232px;height:232px;border-radius:50%;border:4px solid var(--accent);box-sizing:border-box`);

// 08 text: trigger inputs
TRX.forEach((x,i) => text('CH' + (i + 1), x, 22, 'font-size:19px'));
// the Banks window (an action of the plugin, not of the hardware): plain lettering, outlined in green while open
text('BANKS', 180, 22, 'font-size:19px');
// knocked-out lines: [x0, x1, y, labelCentre, labelText, labelTop, fontSize, pad]
const knock = [];
knock.push([TRX[0] - 36, TRX[5] + 36, 58, 862.5, 'TRIG INPUTS', 48, 19, 10]);
text('TRIG INPUTS', 862.5, 48, 'font-size:19px', 'lbl ctr knock0');
// master level
text('MASTER<br>LEVEL', 153, 228);
// program + display
text('PROGRAM', 420, 240);
tag('STORE', 420, 340, 'transform:translateX(-50%);background:#e9e9e9;color:#1b1b1b;padding:1px 6px;border-radius:3px;font-size:18px', 'tag store');
text('PROGRAM/<br>VALUE', 622, 203);
// channel select
text('CHANNEL SELECT', 894, 225);
text('MUTE GROUP', 826, 322, 'font-size:19px');
tag('EDIT GROUP', 962, 321, 'transform:translateX(-50%);color:#7d0f14');
knock.push([770, 1018, 359, 894, 'HOLD TO CLEAR', 348, 19, 8]);
text('HOLD TO CLEAR', 894, 348, 'font-size:19px', 'lbl ctr knock1');
// input channels
text('INPUT CHANNELS', 1250, 203);
chX.forEach((x,i) => text(String(i + 1), x, 234));
text('PEAK / FOCUS', 1457, 262, 'color:#e8343c', 'lbl');
text('TRIG / MG', 1457, 301, 'color:#e8343c', 'lbl');
// brackets: [x, y, width, title]
const brackets = [[350,392,553,'NOISE'],[912,392,553,'CHANNEL'],[350,478,830,'TONE'],[1190,478,130,'CLICK'],[1330,478,135,'MIX']];
brackets.forEach(([x,y,w,t],i) => text(t, x + w/2, y - 14, 'font-weight:800;letter-spacing:.06em', 'lbl ctr bk' + i));
// parameter rows
parX.forEach((x,i) => {
  text(UP[i][0], x + 18, 402, '', 'lbl'); tag(UP[i][1], x + 16, 425);
  text(LO[i][0], x + 18, 489, '', 'lbl');
  if (i === 7) text(LO[i][1], x + 18, 512, '', 'lbl'); else tag(LO[i][1], x + 16, 512, i === 4 ? 'color:#7d0f14' : '');
  text(SHIFT[i], x + 48, 614);
});
text('ROW SELECT', 258, 507);
text('SOLO<br>EDIT', 224, 618, 'font-size:19px', 'lbl');
text('SHIFT / EXIT', 256, 728);
tag('LOWER PARAM', 557, 727, 'transform:translateX(-50%)');
text('REPEAT TEMPO', 557, 834);
text('TRIG', 1398, 724);
text('TRIG LEVEL', 1398, 832);
// 09 wordmark (placeholder lettering)
el('wordmark', `right:85px;top:893px;color:#fff;font-weight:800;font-size:75px;letter-spacing:-.01em;line-height:1;font-family:'Liberation Sans',Arial,sans-serif`, 'nd2 Emu');

// ---- controls (sprite elements in the skin; drawn here for the preview / GIMP reference layer)
const C = (o) => controls.push(o);
const CUT = 3;                            // gap between a button and the edge of its hole in the panel, dp
const btn = (id, kind, button, x, y) => {
  C({ type: 'pbutton', id, kind, button, x: x + 1, y: y + 1, w: 122, h: 59 });
  // the hole: dark, its far edge catching a little of the overhead light; the button's shadow falls straight down into it
  el('cutouts', `left:${x + 1 - CUT}px;top:${y + 1 - CUT}px;width:${122 + 2 * CUT}px;height:${59 + 2 * CUT}px;border-radius:9px;overflow:hidden;` +
    `background:rgba(0,0,0,.28);box-shadow:0 0 0 1px rgba(0,0,0,.18)`,
    `<div style="position:absolute;left:${CUT - 2}px;top:${CUT - 2}px;width:126px;height:63px;border-radius:7px;background:rgba(0,0,0,.55);filter:blur(2px)"></div>`);
  el('controls', `left:${x+1}px;top:${y+1}px`, '', `btn ${kind}`);
};
btn('b_program', 'black', 1, 358, 270);
btn('b_chan_left', 'black', 2, 764, 255);
btn('b_chan_right', 'black', 3, 900, 255);
btn('b_row_select', 'black', 0, 196, 540);
parX.forEach((x,i) => btn('b_param' + (i + 1), 'grey', BTN_PARAM[i], x - 14, 542));
btn('b_shift', 'grey', 24, 194, 760);
btn('b_lower_param', 'grey', 26, 495, 760);
btn('b_trig', 'grey', 25, 1336, 760);
const led = (code, x, y, green) => {
  C({ type: 'led', id: 'l_' + code, code, color: green ? 'green' : 'red', x: x - 11, y: y - 11, w: 22, h: 22 });
  const v = PREVIEW.led[code] || 0;
  el('controls', `left:${x}px;top:${y}px`, `<i style="opacity:${Math.sqrt(v).toFixed(3)}"></i>`, 'led' + (green ? ' green' : ''));
};
parX.forEach((x,i) => { led(LED_UP[i], x, 425); led(LED_LO[i], x, 512); });
chX.forEach((x,i) => { led(LED_PK[i], x, 273, false); led(LED_TG[i], x, 312, true); });
led(LED_SOLO, 207, 632);
// master knob: 128 frames, 240 px cells at 2x (the knob is 172 px of its cell -> 131 dp element)
{ const c = 131, f = Math.round(PREVIEW.master * 127), sc = c / 240;
  C({ type: 'knob', id: 'master', x: 153 - c/2, y: 365 - c/2, w: c, h: c, frames: 128 });
  el('controls', `left:${153 - c/2}px;top:${365 - c/2}px;width:${c}px;height:${c}px;background:url(../../skins/default/nd2-default/ND2MasterKnob.png) ${-(f % 14) * c}px ${-Math.floor(f / 14) * c}px/${3360 * sc}px ${2400 * sc}px`); }

// encoder: 72 frames, 448 px cells (2x of 224 dp)
{ const c = 224, f = PREVIEW.enc;
  C({ type: 'encoder', id: 'value', x: 901 - c/2, y: 821 - c/2, w: c, h: c, frames: 72 });
  el('controls', `left:${901 - c/2}px;top:${821 - c/2}px;width:${c}px;height:${c}px;background:url(../../skins/default/nd2-default/ND2Encoder.png) ${-(f % 12) * c}px ${-Math.floor(f / 12) * c}px/${12 * c}px ${6 * c}px`); }
// display digits: cell 88 x 106 dp around each 56 x 82 digit (room for the slant and the glow)
const DIG = { w: 56, h: 82, padX: 16, padY: 12 };
function digitHTML(b, only) {
  // segment bits (active-low): 0 a top, 1 b upper right, 2 c lower right, 3 d bottom, 4 e lower left, 5 f upper left, 6 g middle, 7 dp
  const on = bit => !((b >> bit) & 1);
  // only undefined: the whole digit for byte b; only -1: every segment unlit; only = bit: just that segment, lit
  const s = (bit, css) => {
    if (only === -1) return `<div class="seg" style="${css};background:#3b0c0c"></div>`;
    const lit = only === undefined ? on(bit) : only === bit;
    if (only !== undefined && !lit) return '';
    return `<div class="seg" style="${css};background:${lit ? '#ff3b2f' : '#3b0c0c'};box-shadow:${lit ? '0 0 7px rgba(255,60,40,.85)' : 'none'}"></div>`;
  };
  return s(0,'left:9px;top:0;width:32px;height:8px') + s(1,'left:42px;top:7px;width:8px;height:31px') +
    s(2,'left:42px;top:44px;width:8px;height:31px') + s(3,'left:9px;top:74px;width:32px;height:8px') +
    s(4,'left:0;top:44px;width:8px;height:31px') + s(5,'left:0;top:7px;width:8px;height:31px') +
    s(6,'left:9px;top:37px;width:32px;height:8px') + s(7,'left:48px;top:73px;width:8px;height:8px;border-radius:50%');
}
PREVIEW.seg.forEach((b,i) => {
  const x = 512 + i * 58, y = 260;
  C({ type: 'segdigit', id: 'd' + i, pos: i, x: x - DIG.padX, y: y - DIG.padY, w: DIG.w + 2 * DIG.padX, h: DIG.h + 2 * DIG.padY });
  el('controls', `left:${x}px;top:${y}px;width:56px;height:82px;transform:skewX(-7deg)`, digitHTML(b));
});

// BANKS: a 92 x 34 dp clickable box; its lit outline is a sprite with room for the glow
const BANKS = { x: 134, y: 15, w: 92, h: 34, glow: 12 };
const banksOutline = (x, y) => `<div style="position:absolute;left:${x}px;top:${y}px;width:${BANKS.w}px;height:${BANKS.h}px;border:2px solid #6dff7c;` +
  `border-radius:6px;box-sizing:border-box;box-shadow:0 0 9px rgba(60,255,90,.85),inset 0 0 6px rgba(60,255,90,.4)"></div>`;
C({ type: 'action', id: 'a_banks', name: 'banks', x: BANKS.x, y: BANKS.y, w: BANKS.w, h: BANKS.h, glow: BANKS.glow });
if (P.get('lit') === '1') el('controls', 'left:0;top:0', banksOutline(BANKS.x, BANKS.y));

if (SPRITE === 'banks') {
  const g = BANKS.glow;
  document.getElementById('canvas').style.cssText = `position:relative;width:${BANKS.w + 2*g}px;height:${BANKS.h + 2*g}px;overflow:hidden`;
  U.style.cssText = 'position:absolute;left:0;top:0';
  U.innerHTML = banksOutline(g, g);
} else if (SEGMODE) {
  // one digit cell for the segment sprite sheet
  const bitOf = { unlit: -1, a: 0, b: 1, c: 2, d: 3, e: 4, f: 5, g: 6, dp: 7 };
  document.getElementById('canvas').style.cssText = `position:relative;width:${DIG.w + 2*DIG.padX}px;height:${DIG.h + 2*DIG.padY}px;overflow:hidden`;
  U.style.cssText = 'position:absolute;left:0;top:0';
  U.innerHTML = `<div style="position:absolute;left:${DIG.padX}px;top:${DIG.padY}px;width:56px;height:82px;transform:skewX(-7deg)">${digitHTML(255, bitOf[SEGMODE])}</div>`;
} else {
  U.innerHTML = html;
  // lines with gaps around their titles (measured, so nothing has to be knocked out with a background colour)
  const W = el2 => el2.getBoundingClientRect();
  const lines = [];
  const add = (x, y, w, h) => lines.push(`<div class="ln" data-layer="lines" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`);
  const uo = W(U);
  knock.forEach(([x0, x1, y, cx, t, ty, fs, pad], i) => {
    const r = W(U.querySelector('.knock' + i)); const l = r.left - uo.left - pad, rr = r.right - uo.left + pad;
    add(x0, y, l - x0, 2); add(rr, y, x1 - rr, 2);
  });
  brackets.forEach(([x, y, w, t], i) => {
    const r = W(U.querySelector('.bk' + i)); const l = r.left - uo.left - 8, rr = r.right - uo.left + 8;
    add(x, y, 2, 12); add(x + w - 2, y, 2, 12); add(x, y, l - x, 2); add(rr, y, x + w - rr, 2);
  });
  U.insertAdjacentHTML('beforeend', lines.join(''));
  if (P.get('bg')) U.querySelectorAll('[data-layer="controls"]').forEach(e => e.classList.add('hide'));
  if (P.get('notext')) U.querySelectorAll('[data-layer]').forEach(e => { const L = e.dataset.layer.split(' ');
    if (L.includes('tagboxes')) e.style.color = 'transparent'; else if (L.includes('text') || L.includes('wordmark')) e.classList.add('hide'); });
  if (LAYER !== 'all') U.querySelectorAll('[data-layer]').forEach(e => { if (!e.dataset.layer.split(' ').includes(LAYER)) e.classList.add('hide'); });
}
window.__controls = controls;
window.__ready = true;
</script>
</body>
</html>
